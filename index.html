/* ----- conjugation ----- */
async function fetchTables(lemmas, say) {
  for (let i = 0; i < lemmas.length; i += 6) {
    const batch = lemmas.slice(i, i + 6);
    say(`Conjugating ${batch.join(", ")}…`);
    onRetry = n => say(`Google is busy, trying again (${n} of 3)…`);
    const r = await gemini([{text: `Conjugate these German verbs: ${batch.join(", ")}. For each verb return its tables with all 6 persons (ich, du, er/sie/es, wir, ihr, sie/Sie), each form written with its pronoun. Return only JSON: {"verbs":[{"lemma":"...","auxiliary":"haben or sein","partizip2":"...","tables":[{"name":"Präsens","forms":["ich …","du …","er/sie/es …","wir …","ihr …","sie/Sie …"]},{"name":"Präteritum","forms":[6]},{"name":"Perfekt","forms":[6]},{"name":"Futur I","forms":[6]},{"name":"Konjunktiv II","forms":[6]},{"name":"Imperativ","forms":["(du) …","(ihr) …","(Sie) …"]}],"notes":"one sentence in ${state.settings.lang} about anything irregular or separable"}]}`}]);
    for (const v of r.verbs || []) if (v && v.lemma && Array.isArray(v.tables)) await dbSet("conj:" + String(v.lemma).toLowerCase(), v);
  }
  onRetry = null;
}
const DRILL_TENSES = ["Präsens", "Präteritum", "Perfekt", "Futur I", "Konjunktiv II"];

  const art = $("#vArt"); if (art) art.onclick = () => { const pick = shuffle(nouns); const items = []; while (items.length < 10) items.push(pick[items.length % pick.length]); startEx({kind: "article", title: "Article sprint", items: items.map(w => ({lemma: w.lemma, article: w.article.toLowerCase(), tr: w.translation}))}); };
}

// A round: every review that's due (up to 20), then new words to fill up to 10 new per round
function roundSize(due, fresh) { const r = Math.min(20, due), n = Math.min(fresh, 10, Math.max(0, 20 - r)); return {r, n}; }
function roundText(due, fresh) {
  const {r, n} = roundSize(due, fresh);
  if (!r && !n) return "Nothing to review today. Come back tomorrow.";
  return `This round: ${[r ? `${r} review${r > 1 ? "s" : ""}` : "", n ? `${n} new word${n > 1 ? "s" : ""}` : ""].filter(Boolean).join(" + ")}. Each card is shown once; words you don't know yet come back tomorrow.`;
}

/* ----- exercise runner ----- */
function startEx(ex) { state.ex = {...ex, i: 0, right: 0, n: 0, xp: 0, added: 0, missed: []}; if (state.view !== "exercises") { state.view = "exercises"; render(); } else renderExItem(); }
function exHeader(ex) {
  return `<div class="row"><span class="muted">${esc(ex.title)} · ${Math.min(ex.i + 1, ex.items.length)} of ${ex.items.length}</span><span class="spacer"></span><span class="xp-pill">+${ex.xp} XP</span><button class="btn slim" id="exStop">Stop</button></div>
    <div class="progress"><div style="width:${ex.i / ex.items.length * 100}%"></div></div>`;
}
function bindStop() { $("#exStop").onclick = () => { const ex = state.ex; state.ex = null; if (ex.n > 0) finishEx(ex); else renderExercises(); }; }
function nextEx() { const ex = state.ex; if (!ex) return; ex.i++; if (ex.i >= ex.items.length) { state.ex = null; finishEx(ex); } else renderExItem(); }
function award(ex, counter, ok, xp) { ex.n++; if (ok) ex.right++; ex.xp += xp; addActivity(counter, 1, xp, ok); }
async function learned(ex, it) { if (it.fromLevel && await markKnown({...it, translation: it.tr || it.front})) ex.added++; }
const ansInput = (id, cls = "") => `<input type="text" id="${id}" class="${cls}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
function judge(val, answer) { const ok = normAns(val) === normAns(answer); return {ok, almost: !ok && foldAns(val) === foldAns(answer)}; }

async function finishEx(ex) {

/* ---------- daily quests, XP, streak ---------- */
let actQueue = Promise.resolve();
const dayOf = t => t ? ds(new Date(t)) : "";
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) { let x = seed || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; }; }
function dayRec(act, d) { return act[d] || (act[d] = {xp: 0, c: {}, q: {}}); }

// counter: what was practised; ok: was the answer right (counts toward "get N right" quests)
function addActivity(counter, n, xp, ok = true) {
  actQueue = actQueue.then(async () => {
    const act = (await dbGet("act")) || {}, a = dayRec(act, todayStr());
    if (counter) { a.c[counter + "_n"] = (a.c[counter + "_n"] || 0) + n; if (ok) a.c[counter] = (a.c[counter] || 0) + n; }
    a.xp += xp || 0;
    await dbSet("act", act);
  }).then(() => evaluateQuests()).catch(e => console.warn(e));
  return actQueue;
}

// Which words you wrote yourself, and the first day you did
function ownWordDates(logs) {
  const first = {}, today = new Set(), t = todayStr();
  for (const log of logs.slice().sort((a, b) => a.date.localeCompare(b.date))) for (const s of log.sentences || []) {
    const own = new Set(String(s.original || "").toLowerCase().split(/[^\p{L}ß]+/u).filter(Boolean));
    for (const w of s.words || []) {
      if (!w.lemma || !w.form || !own.has(String(w.form).toLowerCase())) continue;
      const key = String(w.lemma).trim().toLowerCase() + "|" + posKey(w.pos);
      if (!first[key]) first[key] = log.date;
      if (log.date === t) today.add(key);
    }
  }
  return {first, today};
}

const QUESTS = {

async function todayQuests() {
  const d = todayStr(), act = (await dbGet("act")) || {}, a = dayRec(act, d);
  const logs = await loadLogs(), words = (await allWords(logs)).filter(w => w.translation);
  const ownKeys = new Set(words.filter(w => w.own).map(w => normLemma(w.lemma)));
  const lvl = listWords(await getLevelList(targetLevel()));
  const nouns = words.filter(w => posGroup(w.pos) === "noun" && artClass(w.article));
  const own = ownWordDates(logs), pi = state.pageIndex[d] || {};
  let changed = false;
  if (!a.plan) {
    const rnd = seeded(hashStr(d));
    const pool = ["check", "newwords", "conj", "conj", "gram"];
    if (words.length + lvl.length >= 5) pool.push("cards", "cards");
    if (nouns.length >= 4 || lvl.filter(w => w.article).length >= 4) pool.push("art");
    if (lvl.some(w => w.ex)) pool.push("cloze", "cloze");
    if (!state.settings.key) for (const k of ["check", "newwords", "gram"]) while (pool.includes(k)) pool.splice(pool.indexOf(k), 1);
    const picks = [];
    while (picks.length < 2 && pool.length) { const k = pool.splice(Math.floor(rnd() * pool.length), 1)[0]; if (!picks.includes(k)) picks.push(k); }
    a.plan = ["write", ...picks];
    // word of the day: a word you met in a correction but never wrote yourself; otherwise a core verb you haven't used
    const lvlNew = lvl.filter(w => !ownKeys.has(normLemma(w.lemma))).map(w => ({key: w.key, lemma: w.lemma, article: w.article, translation: w.tr}));
    const cands = lvlNew.length ? lvlNew : words.filter(w => !w.own).map(w => ({key: w.key, lemma: w.lemma, article: w.article, translation: w.translation}));
    const usedLemmas = new Set(Object.keys(own.first).map(k => k.split("|")[0]));
    const coreLeft = CORE_VERBS.filter(v => !usedLemmas.has(v[0])).map(v => ({key: v[0] + "|verb", lemma: v[0], translation: state.settings.lang === "Français" ? v[2] : v[1]}));
    const list = cands.length ? cands : coreLeft;
    if (list.length && state.settings.key) { a.wotd = list[Math.floor(rnd() * list.length)]; a.plan.push("wotd"); }
    changed = true;
  }
  if (changed) await dbSet("act", act);
  const newToday = Object.values(own.first).filter(x => x === d).length;
  const checkedToday = pi.saved && dayOf(pi.savedAt) === d;
  const info = {
    write: {title: "Write a page in your journal", target: 1, have: pi.thumb ? 1 : 0},
    check: {title: "Check today's page and save it to your log", target: 1, have: checkedToday ? 1 : 0},
    wotd: a.wotd ? {title: `Word of the day: use “${a.wotd.article ? a.wotd.article + " " : ""}${a.wotd.lemma}” in today's page`, sub: (a.wotd.translation || "") + " · counts once the page is checked", target: 1, have: own.today.has(a.wotd.key) ? 1 : 0} : null,
    newwords: {title: "Use 3 words you've never written before", sub: "counts once the page is checked", target: 3, have: newToday},
    cards: {title: "Review 15 flashcards", target: 15, have: a.c.cards_n || 0},
    art: {title: "Get 12 articles right (der, die, das)", target: 12, have: a.c.art || 0},
    conj: {title: "Get 10 verb forms right", target: 10, have: a.c.conj || 0},
    gram: {title: "Finish a grammar set", target: 1, have: a.c.gramSets || 0},
    cloze: {title: "Complete 8 sentences correctly", target: 8, have: a.c.cloze || 0}
  };
  return {act, a, quests: a.plan.filter(k => info[k]).map(k => ({id: k, ...QUESTS[k], ...info[k], done: info[k].have >= info[k].target}))};
}

let evaluating = false;
async function evaluateQuests() {
  if (evaluating) return; evaluating = true;
  try {
    const {act, a, quests} = await todayQuests();
    const goal = state.settings.goal || 50;
    for (const q of quests) if (q.done && !a.q[q.id]) { a.q[q.id] = true; a.xp += q.xp; toast(`Quest complete: ${q.title.split(":")[0]}  +${q.xp} XP`, 3200); await sleep(400); }
    if (a.xp >= goal && !a.goalHit) { a.goalHit = true; toast(`🔥 Daily goal reached! Streak: ${streakInfo(act).current} day${streakInfo(act).current > 1 ? "s" : ""}`, 3600); }
    await dbSet("act", act);
  } catch (e) { console.warn(e); }
  evaluating = false;
}
function hitDay(act, d) { const a = act[d]; return !!(a && (a.goalHit || a.xp >= (state.settings.goal || 50))); }
function streakInfo(act) {
  let d = todayStr(); if (!hitDay(act, d)) d = addDays(d, -1);
  let current = 0; while (hitDay(act, d)) { current++; d = addDays(d, -1); }
  const days = Object.keys(act).filter(k => hitDay(act, k)).sort(); let best = 0, run = 0, prev = null;
  for (const k of days) { run = prev && addDays(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return {current, best: Math.max(best, current)};
}

  const week = []; const mon = parseDs(today); mon.setDate(mon.getDate() - (mon.getDay() + 6) % 7);
  for (let i = 0; i < 7; i++) { const d = ds(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i)); week.push(d); }
  const totals = {xp: 0, conj: 0, cards: 0, art: 0}; for (const r of Object.values(act)) { totals.xp += r.xp || 0; totals.conj += r.c.conj || 0; totals.cards += r.c.cards_n || 0; totals.art += r.c.art || 0; }
  const logs = await loadLogs(), known = (await allWords(logs)).filter(w => w.own).length;
  const T = targetLevel(), tst = await levelStats(T);
  const sentences = logs.reduce((n, l) => n + (l.sentences || []).length, 0);
  const pages = Object.values(state.pageIndex).filter(p => p.thumb).length;
  const checks = (await dbGet("checks")) || {}; const validated = Object.values(checks).some(arr => arr.some(r => r.validated));
  const badges = [
    ["Erste Seite", "Write your first journal page", pages >= 1],
    ["Fleißig", "Write 30 journal pages", pages >= 30],
    ["Eine Woche", "Reach a 7-day streak", st.best >= 7],
    ["Ein Monat", "Reach a 30-day streak", st.best >= 30],
    ["100 Wörter", "Use 100 different words yourself", known >= 100],
    ["500 Wörter", "Use 500 different words yourself", known >= 500],
    ["1000 Wörter", "Use 1,000 different words yourself", known >= 1000],
    ["Fehlerjäger", "Save 100 checked sentences", sentences >= 100],
    ["Verbprofi", "Get 300 verb forms right", totals.conj >= 300],
    ["Kartenkönig", "Review 500 flashcards", totals.cards >= 500],
    ["der-die-das", "Get 300 articles right", totals.art >= 300],
    ["Bestanden", "Validate a level check", validated]
  ];
  const pctXp = Math.min(100, a.xp / goal * 100);
  $("#main").innerHTML = `<div class="wrap"><h1>Heute</h1><p class="muted" style="margin-top:4px">${esc(deLong(today))} · target level <b>${T}</b>${tst.lw.length ? ` · ${fmtN(tst.known)} of ${fmtN(tst.total)} ${T} words known` : ""}</p>
    <div class="panel daily-top">
      <div class="streak">${FLAME}<div><div class="pnum" style="margin:0">${st.current}</div><div class="small muted">day streak${st.best > st.current ? ` · best ${st.best}` : ""}</div></div></div>
      <div class="xpbox"><div class="row" style="justify-content:space-between"><b>${a.xp} / ${goal} XP</b><span class="small muted">${a.xp >= goal ? "Goal reached ✓" : `${goal - a.xp} XP to keep your streak`}</span></div>
        <div class="ptrack" style="height:12px"><div style="width:${pctXp}%"></div></div>
        <div class="week">${week.map(d => `<div class="wd ${hitDay(act, d) ? "hit" : ""} ${d === today ? "now" : ""}"><span>${["Mo","Di","Mi","Do","Fr","Sa","So"][week.indexOf(d)]}</span><i>${hitDay(act, d) ? "✓" : ""}</i></div>`).join("")}</div></div>
    </div>
    <h2>Today's quests</h2>
    ${quests.map(q => `<div class="quest ${q.done ? "done" : ""}"><div class="qi">${q.done ? "✓" : q.icon}</div>
      <div style="flex:1;min-width:0"><div><b>${esc(q.title)}</b></div>${q.sub ? `<div class="small muted">${esc(q.sub)}</div>` : ""}
        ${q.target > 1 ? `<div class="ptrack"><div style="width:${Math.min(100, q.have / q.target * 100)}%"></div></div><div class="small muted">${Math.min(q.have, q.target)} / ${q.target}</div>` : ""}</div>
      <div class="qr"><span class="xp-pill">+${q.xp}</span>${q.done ? "" : `<button class="btn slim primary" data-q="${q.id}">Go</button>`}</div></div>`).join("")}
    <p class="small muted">New quests every day. Every exercise earns XP too: 2 per verb form, 3 per grammar question or completed sentence, 1 per flashcard or article. Reach your daily goal (${goal} XP, change it in Settings) to keep your streak.</p>
    <h2>Badges <span class="small muted">${badges.filter(b => b[2]).length} of ${badges.length}</span></h2>
    <div class="badges">${badges.map(([n, d, ok]) => `<div class="badge ${ok ? "ok" : ""}"><div class="medal">${ok ? "★" : "☆"}</div><b>${esc(n)}</b><span class="small muted">${esc(d)}</span></div>`).join("")}</div>
    <p class="small muted" style="margin-top:14px">Total: ${fmtN(totals.xp)} XP</p></div>`;
  document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => QUESTS[b.dataset.q].go());
}

/* ---------- settings & backup ---------- */
function renderSettings() {
  const s = state.settings;
  $("#main").innerHTML = `<div class="wrap"><h1>Settings</h1>
    <div class="panel" style="margin-top:18px">
      <h3>Handwriting reading and explanations (free Gemini key)</h3>
      <p class="small">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (sign in with a Google account, tap <i>Create API key</i>, copy it, paste it here). The key stays on this iPad only.</p>
      <p class="small muted">On the free tier Google may use what you send to improve its models, so don't write private details you wouldn't want read.</p>
      <label class="field" for="key">Gemini API key</label>
      <input type="password" id="key" value="${esc(s.key)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key">
      <label class="field" for="model">Model name</label>
      <input type="text" id="model" value="${esc(s.model)}" autocapitalize="off" spellcheck="false">
      <p class="small muted" style="margin-top:6px">Leave this as <b>gemini-flash-latest</b> unless Google renames its free models. If the check says the model is unknown, look up the current free Flash model name in Google AI Studio.</p>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="saveKey">Save</button><button class="btn" id="testKey">Test connection</button></div>
      <div class="status" id="keyStatus"></div>
    </div>
    <div class="panel">
      <label class="field" for="lang" style="margin-top:0">Explanations in</label>
      <select id="lang">${["English", "Français", "Deutsch (einfach)"].map(l => `<option ${s.lang === l ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label class="field" for="tgtS">Target level</label>
      <select id="tgtS" style="width:auto">${LIST_LEVELS.map(x => `<option ${x === targetLevel() ? "selected" : ""}>${x}</option>`).join("")}</select>
      <p class="small muted" style="margin-top:6px">The exercises and daily quests take their words and verbs from this level's word list. Change it when you're ready for the next level.</p>
      <label class="field" for="goal">Daily goal</label>
      <select id="goal" style="width:auto">${[[30, "30 XP · relaxed"], [50, "50 XP · regular"], [80, "80 XP · serious"], [120, "120 XP · intense"]].map(([v, l]) => `<option value="${v}" ${(s.goal || 50) === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label class="row" style="margin-top:16px;gap:10px"><input type="checkbox" id="finger" ${s.finger ? "checked" : ""} style="width:22px;height:22px"> <span>Write with my finger too <span class="muted small">(off: finger scrolls, only the pencil writes)</span></span></label>
    </div>
    <div class="panel">
      <h3>Backup</h3>
      <p class="small">Everything is saved on this iPad, inside this app. Make a backup now and then: when the share menu opens, choose <b>Save to Files</b> and then <b>iCloud Drive</b>. If the iPad is ever reset, <b>Restore from backup</b> brings everything back.</p>
      <p class="small muted" id="bkLine"></p>
      <div class="row"><button class="btn primary" id="exp">Save a backup file</button><button class="btn" id="imp">Restore from backup</button><input type="file" id="impFile" accept="application/json,.json" hidden></div>
      <div class="status" id="bkStatus"></div>
    </div>
    <p class="small muted" style="margin-top:16px">Grammar checks by <a href="https://languagetool.org" target="_blank" rel="noopener">LanguageTool</a>. Deutschheft keeps no account and sends your writing only to LanguageTool and Gemini when you tap Check.</p>
  </div>`;
  const keyStatus = $("#keyStatus"); renderSettingsBackupLine();
  const persist = async () => { s.key = $("#key").value.trim(); s.model = $("#model").value.trim() || "gemini-flash-latest"; await saveSettings(); };
  $("#saveKey").onclick = async () => { await persist(); keyStatus.textContent = "Saved."; };
  $("#testKey").onclick = async () => {
    await persist(); keyStatus.innerHTML = `<span class="spin"></span>Testing…`;
    try { const r = await gemini([{text: 'Translate "Guten Morgen" into English. Return only JSON: {"t":"..."}'}]); keyStatus.textContent = `It works. Gemini says: “${r.t || "ok"}”.`; }
    catch (e) { keyStatus.textContent = e.message; }
  };
  $("#lang").onchange = async e => { s.lang = e.target.value; await saveSettings(); toast("Saved"); };
  $("#tgtS").onchange = async e => { s.target = e.target.value; await saveSettings(); toast("Target level: " + s.target); };
  $("#goal").onchange = async e => { s.goal = Number(e.target.value); await saveSettings(); toast("Saved"); };
  $("#finger").onchange = async e => { s.finger = e.target.checked; await saveSettings(); toast("Saved"); };
  $("#exp").onclick = async () => { const ok = await doBackup(); if (ok) $("#bkStatus").textContent = "Backup saved."; renderSettingsBackupLine(); };
  $("#imp").onclick = () => $("#impFile").click();
  $("#impFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (j.app !== "deutschheft" || !j.data) throw new Error("This file is not a Deutschheft backup.");
      if (!confirm("Restore this backup? Pages and log entries with the same date will be replaced by the backup's version.")) return;
      for (const [k, v] of Object.entries(j.data)) { if (k === "settings" && state.settings.key) continue; await dbSet(k, v); }
      await loadState(); $("#bkStatus").textContent = "Backup restored."; renderSettings();
    } catch (err) { $("#bkStatus").textContent = err.message; }
  };
}

async function doBackup() {
  try {
    const data = await dbAll();
    const json = JSON.stringify({app: "deutschheft", version: 1, exported: new Date().toISOString(), data});
    const name = `deutschheft-backup-${todayStr()}.json`;
    const file = new File([json], name, {type: "application/json"});
    let done = false;
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], title: "Deutschheft backup"}); done = true; }
      catch (e) { if (e.name === "AbortError") return false; }
    }
    if (!done) {
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
    state.lastBackup = Date.now(); await dbSet("lastBackup", state.lastBackup);
    return true;
  } catch (e) { toast("Backup failed: " + e.message, 5000); return false; }
}
function renderSettingsBackupLine() {
  const el = $("#bkLine"); if (!el) return;
  el.textContent = state.lastBackup ? `Last backup: ${new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "long", year: "numeric"}).format(new Date(state.lastBackup))}.` : "No backup saved yet.";
}

/* ---------- start ---------- */
async function loadState() {
  state.settings = {...DEFAULT_SETTINGS, ...((await dbGet("settings")) || {})};
  state.pageIndex = (await dbGet("pageIndex")) || {};
  state.lastBackup = (await dbGet("lastBackup")) || null;
}
(async function init() {
  try { await loadState(); }
  catch (e) { document.body.innerHTML = `<div class="wrap"><h1>Deutschheft can't open its storage</h1><p>${esc(e.message)}</p><p>In Safari, private browsing blocks storage. Open this page in a normal tab.</p></div>`; return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  render();
})();

</script>
